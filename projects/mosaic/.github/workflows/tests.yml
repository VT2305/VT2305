name: tests-and-benchmarks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check mosaic tests evals
      - name: Tests
        run: pytest -q
      - name: Evaluate rules-based search
        run: python -m evals.run_eval
